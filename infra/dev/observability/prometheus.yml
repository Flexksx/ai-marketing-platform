global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Container-level CPU/memory/network via cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only vozai containers to reduce cardinality
      - source_labels: [container_label_com_docker_compose_service]
        action: keep
        regex: "(api|worker|db|kong|auth|rest|storage|loki|tempo|prometheus|grafana|vector)"
